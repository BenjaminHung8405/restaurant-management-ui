<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
        </linearGradient>
    </defs>

    <rect width="800" height="600" fill="url(#bgGradient)" />

    <!-- Plate -->
    <circle cx="400" cy="320" r="150" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="400" cy="320" r="140" fill="#fafafa" />

    <!-- Food illustration (simple bowl/dish) -->
    <ellipse cx="400" cy="300" rx="100" ry="50" fill="#fbbf24" opacity="0.3" />
    <path d="M 300 300 Q 300 360 400 370 Q 500 360 500 300" fill="#f59e0b" opacity="0.4" />

    <!-- Decorative elements (fork & spoon) -->
    <g opacity="0.2">
        <!-- Fork -->
        <line x1="250" y1="200" x2="250" y2="380" stroke="#94a3b8" stroke-width="3" />
        <circle cx="240" cy="390" r="8" fill="none" stroke="#94a3b8" stroke-width="3" />
        <line x1="245" y1="280" x2="230" y2="270" stroke="#94a3b8" stroke-width="3" />
        <line x1="250" y1="280" x2="250" y2="270" stroke="#94a3b8" stroke-width="3" />
        <line x1="255" y1="280" x2="270" y2="270" stroke="#94a3b8" stroke-width="3" />

        <!-- Spoon -->
        <line x1="550" y1="200" x2="550" y2="380" stroke="#94a3b8" stroke-width="3" />
        <ellipse cx="550" cy="390" rx="12" ry="16" fill="none" stroke="#94a3b8" stroke-width="3" />
    </g>

    <!-- Text -->
    <text x="400" y="480" font-family="Inter, sans-serif" font-size="28" font-weight="600" text-anchor="middle"
        fill="#64748b">
        Không có hình ảnh
    </text>
    <text x="400" y="520" font-family="Inter, sans-serif" font-size="16" text-anchor="middle" fill="#94a3b8">
        Vui lòng thêm hình ảnh cho món ăn
    </text>
</svg>